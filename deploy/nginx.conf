# CurlViz nginx 配置（纯 HTTP 模板）
# install.sh 会把 __DOMAIN__ 和 __INSTALL_DIR__ 替换成实际值，
# 写到 /etc/nginx/conf.d/curlviz.conf（Debian/CentOS 通用）。
#
# 注意：这里故意不写 ssl_certificate / listen 443——证书由后续的
# `certbot --nginx --redirect` 自动签发并改写本文件加上 TLS + 80→443 跳转。
# 若提前写死证书路径，nginx -t 会因证书尚不存在而失败。

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot HTTP-01 验证用（续签时也走这里）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端静态文件（web/dist 由 vite build 产出）
    root __INSTALL_DIR__/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /exec 反代到 agent（只监听 127.0.0.1，不直接暴露公网）
    location /exec {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin 头透传，agent 做同源校验
        proxy_set_header Origin $http_origin;
        # 超时与 agent 的 maxTimeMs 对齐（默认 60s）
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        # 不缓冲响应，流式返回
        proxy_buffering off;
    }

    # /healthz 也反代（前端探活用）
    location /healthz {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }
}
