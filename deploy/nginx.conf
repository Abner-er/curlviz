# CurlViz nginx 配置片段
# install.sh 会把 __DOMAIN__ 和 __INSTALL_DIR__ 替换成实际值
# 放到 /etc/nginx/sites-available/curlviz 并 ln -s 到 sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    # certbot 签证书前需要 80 端口能响应，签完后自动改写成 301 跳转
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # certbot 会自动填这两行
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 前端静态文件（web/dist 由 vite build 产出）
    root __INSTALL_DIR__/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /exec 反代到 agent（只监听 127.0.0.1，不直接暴露公网）
    location /exec {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin 头透传，agent 做同源校验
        proxy_set_header Origin $http_origin;
        # 超时与 agent 的 maxTimeMs 对齐（默认 60s）
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        # 不缓冲响应，流式返回
        proxy_buffering off;
    }

    # /healthz 也反代（前端探活用）
    location /healthz {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }
}
