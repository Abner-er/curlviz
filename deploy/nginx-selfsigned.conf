# CurlViz nginx 配置（自签证书 HTTPS 模板，install.sh --self-signed 用）
# install.sh 会替换占位符后写到 /etc/nginx/conf.d/curlviz.conf：
#   __ADDRESS__（域名或 IP）、__INSTALL_DIR__、__HTTP_PORT__（默认 80）、
#   __HTTPS_PORT__（默认 443）、__REDIRECT_BASE__（跳转目标，443 省略端口）。
#
# 与 nginx.conf（受信证书模板）的区别：这里直接写死 ssl_certificate 指向
# /etc/curlviz/tls/——因为 install.sh 在写本配置之前已用 openssl 生成好证书，
# 所以 nginx -t 时证书已存在，不会失败。无需 certbot / 域名 / 备案。

# HTTP 端口整体跳转到 HTTPS（__REDIRECT_BASE__ 已含非标端口）
server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name __ADDRESS__;
    return 301 __REDIRECT_BASE__$request_uri;
}

server {
    listen __HTTPS_PORT__ ssl http2;
    listen [::]:__HTTPS_PORT__ ssl http2;
    server_name __ADDRESS__;

    # 自签证书（install.sh 用 openssl 生成，有效期 3650 天）
    ssl_certificate     /etc/curlviz/tls/cert.pem;
    ssl_certificate_key /etc/curlviz/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 前端静态文件（web/dist 由 vite build 产出）
    root __INSTALL_DIR__/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /exec 反代到 agent（只监听 127.0.0.1，不直接暴露公网）
    location /exec {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin 头透传，agent 做同源校验
        proxy_set_header Origin $http_origin;
        # 超时与 agent 的 maxTimeMs 对齐（默认 60s）
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        # 不缓冲响应，流式返回
        proxy_buffering off;
    }

    # /healthz 也反代（前端探活用）
    location /healthz {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }
}
